[project]
name = "image-transfer-learning"
version = "1.0.0"
description = "Core vs Well Log image classification with ResNet50 transfer learning (TensorFlow/Keras)"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Jaimin Babariya", email = "jaiminbabariya7@gmail.com"}]
keywords = ["python", "tensorflow", "keras", "transfer-learning", "resnet50", "image-classification"]
dependencies = [
    "tensorflow>=2.8",
    "numpy<2.0",
    "opencv-python",
    "pillow",
    "scikit-image",
    "imgaug",
    "scikit-learn",
    "matplotlib",
    "jupyter",
]
